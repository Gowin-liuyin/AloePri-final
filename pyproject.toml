[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aloepri-paper-aligned"
version = "0.2.0"
description = "AloePri research implementation with explicit experimental and deployment limits."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.4,<2.5",
  "torch>=2.13,<2.14",
  "transformers>=5.19,<5.20",
  "accelerate>=1.15,<1.16",
  "safetensors>=0.8,<0.9",
  "cryptography>=49,<50",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<9.2"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
